<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - Gemalot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#0b0f19;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
.bg{position:fixed;inset:0;background:
  radial-gradient(circle at 15% 20%,rgba(250,204,21,.25),transparent 35%),
  radial-gradient(circle at 85% 25%,rgba(249,115,22,.2),transparent 30%),
  radial-gradient(circle at 50% 80%,rgba(34,197,94,.15),transparent 40%),
  #0b0f19;z-index:0}
.container{position:relative;z-index:1;width:92%;max-width:400px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:40px 30px;backdrop-filter:blur(20px);box-shadow:0 25px 50px rgba(0,0,0,.45);text-align:center}
.logo{width:75px;height:75px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(135deg,#facc15,#f97316,#22c55e,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;box-shadow:0 8px 25px rgba(250,204,21,.35);color:#111}
h1{font-size:24px;margin-bottom:6px}
.subtitle{color:#9ca3af;font-size:14px;margin-bottom:28px}
.input-group{margin-bottom:16px;text-align:right}
.input-group label{display:block;font-size:13px;color:#a0b8d8;margin-bottom:6px}
.input-group input{width:100%;padding:14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:15px;outline:none}
.input-group input:focus{border-color:#facc15;box-shadow:0 0 0 3px rgba(250,204,21,.15)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#facc15,#f97316,#22c55e);color:#111;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.message{margin-top:14px;font-size:14px;min-height:20px}
.message.error{color:#ff6b6b}
.message.success{color:#4ade80}
.links{margin-top:22px;font-size:14px;color:#9ca3af}
.links a{color:#facc15;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
  <div class="logo">G</div>
  <h1>إنشاء حساب جديد</h1>
  <p class="subtitle">انضم إلى Gemalot</p>

  <div class="input-group">
    <label>الاسم</label>
    <input type="text" id="name" placeholder="اسمك">
  </div>
  <div class="input-group">
    <label>البريد الإلكتروني أو رقم الهاتف</label>
    <input type="text" id="email" placeholder="example@email.com أو 05xxxxxxxx">
  </div>
  <div class="input-group">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="6 أحرف على الأقل">
  </div>
  <div class="input-group">
    <label>تأكيد كلمة المرور</label>
    <input type="password" id="password2" placeholder="أعد كتابة كلمة المرور">
  </div>

  <button class="btn" onclick="signup()">إنشاء الحساب</button>
  <div class="message" id="msg"></div>
  <div class="links">لديك حساب بالفعل؟ <a href="signin.html">تسجيل الدخول</a></div>
</div>

<script>
function getUsers(){return JSON.parse(localStorage.getItem("alislamiah_users")||"[]")}
function setUsers(u){localStorage.setItem("alislamiah_users",JSON.stringify(u))}
function setCurrentUser(u){localStorage.setItem("alislamiah_current_user",JSON.stringify(u))}

if(localStorage.getItem("alislamiah_current_user")){window.location.href="index.html"}

function signup(){
  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  const password2=document.getElementById("password2").value;
  const msg=document.getElementById("msg");
  msg.textContent="";msg.className="message";

  if(!name||!email||!password){msg.className="message error";msg.textContent="املأ جميع الحقول";return}
  if(password.length<6){msg.className="message error";msg.textContent="كلمة المرور قصيرة";return}
  if(password!==password2){msg.className="message error";msg.textContent="كلمة المرور غير متطابقة";return}

  const users=getUsers();
  if(users.find(u=>u.email===email||u.phone===email)){msg.className="message error";msg.textContent="هذا الحساب موجود مسبقاً";return}

  const newUser={id:Date.now().toString(),name,email,phone:email.includes("@")?null:email,password};
  users.push(newUser);
  setUsers(users);
  setCurrentUser({id:newUser.id,name:newUser.name,email:newUser.email||newUser.phone});
  window.location.href="index.html";
}
</script>
</body>
</html>
