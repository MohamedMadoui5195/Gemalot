<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alislamiah Password Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#0b0f19;color:#fff;min-height:100vh;padding:16px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.back-btn{width:40px;height:40px;border:none;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:18px;cursor:pointer}
.header h1{font-size:20px;color:#facc15}
.container{max-width:600px;margin:0 auto}
.card{background:#151a27;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px;margin-bottom:16px}
.field{margin-bottom:22px}
.field:last-child{margin-bottom:0}
.label{font-size:13px;color:#9ca3af;margin-bottom:8px;display:block}
.value{font-size:16px;color:#fff;font-weight:600;background:#0b0f19;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;word-break:break-all;line-height:1.5}
.value.pass{letter-spacing:2px;display:flex;justify-content:space-between;align-items:center}
.eye{cursor:pointer;font-size:18px;user-select:none;padding:4px 8px;background:rgba(255,255,255,.06);border-radius:8px}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:bold;cursor:pointer;font-size:14px;margin-top:10px}
.btn.danger{background:#7f1d1d;color:#fff}
.btn.secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
.warning{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:14px;padding:14px;font-size:12px;color:#fca5a5;line-height:1.7;margin-top:16px;text-align:center}
.top-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(90deg,#facc15,#f97316);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;color:#111}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.3);margin-top:8px}
</style>
</head>
<body>
<div class="header">
  <button class="back-btn" onclick="location.href='settings.html'">←</button>
  <h1>Alislamiah password manager 🔑</h1>
</div>
<div class="container">
  <div class="card">
    <div class="top-icon">👤</div>
    <div style="text-align:center;margin-bottom:20px"><div style="font-size:18px;font-weight:bold;color:#facc15">الملف الشخصي</div><span class="badge" id="status">نشط</span></div>

    <div class="field">
      <span class="label">إسم المستخدم</span>
      <div class="value" id="valName">-</div>
    </div>

    <div class="field">
      <span class="label">الإيميل المستعمل</span>
      <div class="value" id="valEmail">-</div>
    </div>

    <div class="field">
      <span class="label">الهاتف المستعمل</span>
      <div class="value" id="valPhone">-</div>
    </div>

    <div class="field">
      <span class="label">الباسورد</span>
      <div class="value pass"><span id="valPass">••••••••</span><span class="eye" onclick="togglePass()">👁️</span></div>
      <div id="passHint" style="font-size:11px;color:#6b7280;margin-top:6px">في حالة الإظهار يظهر الباسورد الحقيقي</div>
    </div>

    <div class="field">
      <span class="label">المعرف (ID)</span>
      <div class="value" id="valId" style="font-size:12px;color:#9ca3af">-</div>
    </div>

    <button class="btn secondary" onclick="copyAll()">نسخ كل البيانات</button>
    <button class="btn danger" onclick="signOut()">تسجيل خروج</button>

    <div class="warning">
      ⚠️ إذا تم تسجيل الخروج سيتم إنشاء حساب من البداية، وستفقد المحادثات والاشتراك المرتبط بهذا المستخدم في هذا الجهاز.
    </div>
  </div>
</div>

<script>
let showPass=false;
let realData={name:"-",email:"-",phone:"-",password:"-",id:"-"};

function safeParse(str){
  try{ return JSON.parse(str); }catch{ return null; }
}

function loadData(){
  const rawCurrent = localStorage.getItem("alislamiah_current_user") || "";
  let parsed = safeParse(rawCurrent);
  // إذا كان JSON مثل {"id":...,"name":"Madoui Mohamed","email":"..."}
  if(parsed && typeof parsed === "object"){
    realData.name = parsed.name || parsed.fullName || parsed.username || "-";
    realData.email = parsed.email || "-";
    realData.id = parsed.id || "-";
    realData.phone = parsed.phone || "-";
  }else{
    realData.name = rawCurrent || "-";
  }

  // ابحث في alislamiah_users
  try{
    const usersRaw = localStorage.getItem("alislamiah_users") || localStorage.getItem("users") || "{}";
    const users = JSON.parse(usersRaw);
    const key = rawCurrent || Object.keys(users)[0];
    let u = users[key] || users[realData.name] || users[realData.email] || null;
    if(!u){
      // جرب البحث بالقيمة
      for(let k in users){
        const obj=users[k];
        if(obj && (obj.email===realData.email || obj.name===realData.name)){ u=obj; break; }
      }
    }
    if(u){
      realData.name = u.name || u.username || u.fullName || realData.name;
      realData.email = u.email || realData.email;
      realData.phone = u.phone || u.tel || realData.phone;
      realData.password = u.password || u.pass || realData.password;
      realData.id = u.id || realData.id;
    }
  }catch{}

  // مفاتيح مباشرة
  realData.email = localStorage.getItem("alislamiah_current_email") || realData.email;
  realData.phone = localStorage.getItem("alislamiah_current_phone") || realData.phone;
  realData.password = localStorage.getItem("alislamiah_current_password") || localStorage.getItem("current_password") || realData.password;
  // إذا لم نجد باسورد، جرب alislamiah_passwords
  if(realData.password==="-"){
    try{
      const pwds = JSON.parse(localStorage.getItem("alislamiah_passwords")||"{}");
      realData.password = pwds[realData.email] || pwds[realData.name] || "-";
    }catch{}
  }

  document.getElementById("valName").textContent = realData.name;
  document.getElementById("valEmail").textContent = realData.email;
  document.getElementById("valPhone").textContent = realData.phone;
  document.getElementById("valId").textContent = realData.id;
  document.getElementById("valPass").textContent = showPass ? realData.password : "••••••••";
}

function togglePass(){
  showPass=!showPass;
  document.getElementById("valPass").textContent = showPass ? realData.password : "••••••••";
}

function copyAll(){
  const text = `إسم المستخدم\n${realData.name}\n\nالإيميل المستعمل\n${realData.email}\n\nالهاتف\n${realData.phone}\n\nالباسورد\n${realData.password}\n\nID\n${realData.id}`;
  navigator.clipboard.writeText(text).then(()=>alert("تم نسخ كل البيانات ✅"));
}

function signOut(){
  if(!confirm("⚠️ إذا تم تسجيل الخروج سيتم إنشاء حساب من البداية.\n\nهل أنت متأكد؟")) return;
  localStorage.removeItem("alislamiah_current_user");
  localStorage.removeItem("alislamiah_current_email");
  localStorage.removeItem("alislamiah_current_phone");
  localStorage.removeItem("alislamiah_current_password");
  localStorage.removeItem("current_user");
  localStorage.removeItem("gemalot_subscription_active");
  localStorage.removeItem("gemalot_subscription_expiry");
  alert("تم تسجيل الخروج");
  location.href="signin.html";
}

loadData();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
